name: Deploy

# Deploys only after CI passes on main. Feature-branch code never reaches
# production secrets: this runs on the protected main branch using an
# environment that holds the SSH deploy credentials.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy only when CI succeeded AND the operator has opted in by setting the
    # repository variable DEPLOY_ENABLED=true (after configuring the VPS + secrets).
    # This keeps the workflow dormant — not failing — until infrastructure exists.
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production   # holds DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY secrets
    steps:
      - name: Deploy over SSH (pull + migrate + rolling restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/adcc-command-center
            PREV=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            # The named data volume is never recreated, so operational data survives.
            docker compose up -d --build
            # Health gate with rollback on failure.
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1/api/health >/dev/null; then
                echo "healthy"; exit 0
              fi
              sleep 4
            done
            echo "Health check failed — rolling back to $PREV"
            git reset --hard "$PREV"
            docker compose up -d --build
            exit 1
