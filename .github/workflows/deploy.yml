name: Deploy

# Secure deploy: a GitHub-hosted runner joins your private Tailscale tailnet as
# an EPHEMERAL, tagged node (tag:ci), reaches ONLY the VM's SSH port (enforced by
# your tailnet ACL), and deploys over that private link. No public SSH rule, no
# permanent self-hosted runner. Runs only after CI passes on main, gated by the
# DEPLOY_ENABLED variable, in the protected `production` environment.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write   # for the Tailscale OAuth exchange

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connect to tailnet (ephemeral, tag:ci)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Deploy over the tailnet (pull + build + health-gate + rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}        # the VM's tailnet IP (100.x) or MagicDNS name
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/adcc-command-center
            PREV=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            # The named data volume is never recreated, so operational data survives.
            docker compose up -d --build
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1/api/health >/dev/null; then
                echo "healthy"; exit 0
              fi
              sleep 4
            done
            echo "Health check failed — rolling back to $PREV"
            git reset --hard "$PREV"
            docker compose up -d --build
            exit 1
