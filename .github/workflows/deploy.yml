name: Deploy

# Deploys only after CI passes on main. Feature-branch code never reaches
# production secrets: this runs on the protected main branch using an
# environment that holds the SSH deploy credentials.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy if CI succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production   # holds DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY secrets
    steps:
      - name: Deploy over SSH (pull + migrate + rolling restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/adcc-command-center
            git fetch --all
            git reset --hard origin/main
            # Data volume is preserved; build and restart only.
            docker compose pull || true
            docker compose up -d --build
            # Health gate with rollback on failure.
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:${HTTP_PORT:-80}/api/health; then
                echo "healthy"; exit 0
              fi
              sleep 4
            done
            echo "Health check failed — rolling back"; git reset --hard HEAD@{1}; docker compose up -d --build; exit 1
