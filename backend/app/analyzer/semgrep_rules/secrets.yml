# Offline Semgrep rules for hardcoded secrets (language-agnostic, regex-based).
rules:
  - id: adcc-generic-hardcoded-secret
    languages: [generic]
    severity: WARNING
    message: "Possible hardcoded secret assigned in source code."
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      references: ["https://cwe.mitre.org/data/definitions/798.html"]
    patterns:
      - pattern-regex: '(?i)(api[_-]?key|secret|password|passwd|token|access[_-]?key)\s*[:=]\s*["''][A-Za-z0-9/+_\-]{12,}["'']'

  - id: adcc-generic-aws-access-key
    languages: [generic]
    severity: ERROR
    message: "Possible AWS access key id in source code."
    metadata:
      cwe: ["CWE-798"]
      references: ["https://cwe.mitre.org/data/definitions/798.html"]
    patterns:
      - pattern-regex: 'AKIA[0-9A-Z]{16}'

  - id: adcc-generic-private-key
    languages: [generic]
    severity: ERROR
    message: "Private key material committed in source."
    metadata:
      cwe: ["CWE-798"]
      references: ["https://cwe.mitre.org/data/definitions/798.html"]
    patterns:
      - pattern-regex: '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
