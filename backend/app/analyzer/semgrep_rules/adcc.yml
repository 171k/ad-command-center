# Local Semgrep rules bundled so the optional Semgrep engine runs fully OFFLINE
# (no --config auto / registry fetch). These complement the built-in engine.
rules:
  - id: adcc-python-eval-exec
    languages: [python]
    message: "Dynamic eval()/exec() can execute attacker-controlled code (CWE-95)."
    severity: ERROR
    metadata:
      cwe: ["CWE-95: Improper Control of Generation of Code"]
      references: ["https://cwe.mitre.org/data/definitions/95.html"]
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: adcc-python-subprocess-shell-true
    languages: [python]
    message: "subprocess with shell=True enables command injection (CWE-78)."
    severity: ERROR
    metadata:
      cwe: ["CWE-78: OS Command Injection"]
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: adcc-python-yaml-load
    languages: [python]
    message: "yaml.load without SafeLoader can instantiate arbitrary objects (CWE-502)."
    severity: WARNING
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
    patterns:
      - pattern: yaml.load($X)
      - pattern-not: yaml.load($X, Loader=yaml.SafeLoader)

  - id: adcc-js-eval
    languages: [javascript, typescript]
    message: "eval()/Function() executes strings as code (CWE-95)."
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
